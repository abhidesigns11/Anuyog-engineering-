<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products — Anuyog Engineering, Vapi</title>
<meta name="description" content="The full range from Anuyog Engineering: stainless steel furniture, lockers, mixing tanks, jacketed vessels, GMP equipment, dustbins and sanitary fittings.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="wrap"><div class="crumb"><a href="index.html">Home</a> &rsaquo; All products</div></div>

<section class="sec" style="padding-top:8px">
  <div class="wrap">
    <div class="sec-hd">
      <h1>The full range</h1>
      <p class="lede">Six categories, each holding products with their own size and capacity
        options. Prices shown are indicative starting prices — the written quotation depends on
        grade, finish, quantity and delivery.</p>
    </div>
    <div class="cats" id="catNav" style="margin-bottom:34px"></div>
    <div id="all"></div>
  </div>
</section>

<script src="assets/firebase.js"></script>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  await adminReady();
  document.getElementById("catNav").innerHTML = CATEGORIES.map(c => `
    <a class="cat" href="category.html?c=${c.slug}">
      <h3>${esc(c.name)}</h3>
      <p>${esc(c.blurb)}</p>
      <b>${byCat(c.slug).length} products &rarr;</b>
    </a>`).join("");

  document.getElementById("all").innerHTML = CATEGORIES.map(c => `
    <div style="margin-bottom:44px">
      <div class="sec-hd" style="display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px">
        <h2 style="margin:0">${esc(c.name)}</h2>
        <a href="category.html?c=${c.slug}" style="font-size:14px;font-weight:600;color:var(--brass)">Open category &rarr;</a>
      </div>
      <div class="grid">${byCat(c.slug).map(card).join("")}</div>
    </div>`).join("");
});
</script>
</body>
</html>
